# 서울시 정적 데이터(화장실·와이파이·문화공간·Visit Seoul·체험 예약·지하철 노선망) 주 1회 갱신 → 바뀐 게 있으면 PR
# 필요: 저장소 Settings → Secrets and variables → Actions → SEOUL_OPENAPI_KEY
name: seoul-data

on:
  schedule:
    - cron: "0 18 * * 0" # 매주 월요일 03:00 KST
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  sync:
    runs-on: [self-hosted, crowdview]
    env:
      # 단계의 if 는 secrets를 직접 못 읽어서 job env로 넘긴다
      DATA_GO_KR_KEY: ${{ secrets.DATA_GO_KR_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/seoul-data/sync.mjs
        env:
          SEOUL_OPENAPI_KEY: ${{ secrets.SEOUL_OPENAPI_KEY }}
          # 새로 생긴 주소만 좌표로 바꾼다 (geocode.json 캐시, 실행당 최대 3,000건)
          NEXT_PUBLIC_NAVER_MAP_CLIENT_ID: ${{ secrets.NEXT_PUBLIC_NAVER_MAP_CLIENT_ID }}
          NAVER_MAP_CLIENT_SECRET: ${{ secrets.NAVER_MAP_CLIENT_SECRET }}
      # 지역별 대표 명소 사진·좌표 (한국관광공사 TourAPI). Secrets에 DATA_GO_KR_KEY가 없으면 건너뛴다
      - run: node scripts/korea-data/landmarks.mjs
        if: ${{ env.DATA_GO_KR_KEY != '' }}
      # 지역별 명소 디렉터리 (관광지·문화시설·레포츠, 호출 51건)
      - run: node scripts/korea-data/spots.mjs
        if: ${{ env.DATA_GO_KR_KEY != '' }}
      - uses: peter-evans/create-pull-request@v7
        with:
          branch: chore/seoul-data
          title: "chore: 서울시 정적 데이터 주간 갱신"
          commit-message: "chore: weekly Seoul open data sync"
          body: "화장실·와이파이·문화공간·Visit Seoul·체험 예약·지하철 노선망 데이터를 다시 받았어요 (scripts/seoul-data/sync.mjs). 변경분 확인 후 머지하세요."
          add-paths: |
            src/data/seoul/*.json
            src/data/korea/*.json
          delete-branch: true
