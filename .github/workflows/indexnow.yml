# 매주 월요일 05:00 KST (데이터 갱신 뒤) 사이트맵 주소를 IndexNow(Bing·네이버 등)에 알린다. 비밀 키 필요 없음
name: indexnow

on:
  schedule:
    - cron: "0 20 * * 0"
  workflow_dispatch:

# 집 데스크탑(Windows) 러너: PowerShell 스크립트 실행 정책에 막히지 않게 명령 프롬프트(cmd)로 실행
defaults:
  run:
    shell: cmd

jobs:
  ping:
    runs-on: [self-hosted, crowdview]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/indexnow.mjs
