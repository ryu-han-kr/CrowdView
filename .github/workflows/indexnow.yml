# 매주 월요일 05:00 KST (데이터 갱신 뒤) 사이트맵 주소를 IndexNow(Bing·네이버 등)에 알린다. 비밀 키 필요 없음
name: indexnow

on:
  schedule:
    - cron: "0 20 * * 0"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/indexnow.mjs
