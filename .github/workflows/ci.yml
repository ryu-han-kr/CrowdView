# PR·main 푸시마다 타입 검사 + 핵심 계산 테스트 (코스·지하철·예측·결제 규칙) + 화면 자동 시험(Playwright). 비밀 키가 필요 없다
name: ci

# 문서·참고 사진만 바뀐 PR은 건너뛴다.
# 10/22부터 집 데스크탑(Windows) 자체 러너에서 돈다 (라벨 crowdview): 비공개 저장소의 GitHub 서버 무료 시간(월 2,000분)을 다 써서.
# 데스크탑이 꺼져 있으면 켜질 때까지 대기한다.
# 10/30 경수님: 저녁 8시~아침 8시(KST)는 데스크탑을 게임에 쓰므로 무거운 일은 노트북 러너(라벨 laptop)에서만 — where 작업이 시각을 보고 고른다
on:
  pull_request:
    paths-ignore: ["docs/**", "**/*.md", "photo/**"]
  push:
    branches: [main]
    paths-ignore: ["docs/**", "**/*.md", "photo/**"]

jobs:
  # 어느 러너에서 돌릴지 (2초짜리라 데스크탑에서 돌아도 부담 없음)
  # 10/31 경수님 '산업체에 들어가도 이어갈 수 있게': 저장소 변수 CI_RUNNER=hosted 이면 GitHub 서버(우분투)에서 돈다 — 집 PC가 꺼져 있어도 검사가 멈추지 않게.
  # 바꾸기: gh variable set CI_RUNNER --body hosted (되돌리기: --body home 또는 변수 삭제). 무료 월 2,000분이라 수정이 적은 유지 모드용
  where:
    runs-on: ${{ vars.CI_RUNNER == 'hosted' && 'ubuntu-latest' || fromJSON('["self-hosted","crowdview"]') }}
    outputs:
      labels: ${{ steps.h.outputs.labels || steps.t.outputs.labels }}
      shell: ${{ steps.h.outputs.labels && 'bash' || 'cmd' }}
    steps:
      - id: h
        if: vars.CI_RUNNER == 'hosted'
        shell: bash
        run: echo 'labels="ubuntu-latest"' >> "$GITHUB_OUTPUT"
      - id: t
        if: vars.CI_RUNNER != 'hosted'
        # 러너 PC의 스크립트 실행 정책에 막히지 않게 (10/30 데스크탑에서 막혔다)
        shell: powershell -NoProfile -ExecutionPolicy Bypass -File {0}
        run: |
          $h = [DateTime]::UtcNow.AddHours(9).Hour
          $l = if ($h -ge 20 -or $h -lt 8) { '["self-hosted","crowdview","laptop"]' } else { '["self-hosted","crowdview"]' }
          Add-Content -Path $env:GITHUB_OUTPUT -Value "labels=$l"

  check:
    needs: where
    runs-on: ${{ fromJSON(needs.where.outputs.labels) }}
    # 집 데스크탑(Windows): PowerShell 스크립트 실행 정책에 막히지 않게 cmd, GitHub 서버면 bash
    defaults:
      run:
        shell: ${{ needs.where.outputs.shell }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test

  # 화면 자동 시험: 앱을 빌드해서 띄우고(비밀 키 없이 → 예측 데이터) 휴대폰 크롬·사파리 엔진·PC에서 주요 화면을 연다
  e2e:
    # PR에서 이미 돌린 시험을 머지 뒤 main에서 또 돌리지 않는다 (9분 × 2)
    if: github.event_name == 'pull_request'
    needs: where
    runs-on: ${{ fromJSON(needs.where.outputs.labels) }}
    timeout-minutes: 25
    defaults:
      run:
        shell: ${{ needs.where.outputs.shell }}
    # 공공데이터 대신 tests/fixtures/normal 자료로 빌드·실행 → 화면 사이 숫자까지 비교 (e2e/fixtures.spec.ts)
    env:
      DATA_FIXTURES: normal
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      # 리눅스(GitHub 서버)는 브라우저가 쓰는 시스템 라이브러리도 함께 설치
      - run: npx playwright install ${{ runner.os == 'Linux' && '--with-deps' || '' }} chromium webkit
      - run: npx playwright test
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 7
