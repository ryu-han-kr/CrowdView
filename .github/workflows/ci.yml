# PR·main 푸시마다 타입 검사 + 핵심 계산 테스트 (코스·지하철·예측·결제 규칙). 비밀 키가 필요 없다
name: ci

on:
  pull_request:
  push:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
